<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI BOT MYSTERY</title>
<style>header{display:grid!important;grid-template-columns:minmax(0,1fr) auto;gap:18px!important;align-items:center!important}header h1{min-width:0;line-height:1.12!important;overflow-wrap:anywhere}.coins{max-width:310px;white-space:normal!important;line-height:1.35!important;text-align:center;position:relative;z-index:2}.sign{line-height:1.25!important;overflow-wrap:anywhere}@media(max-width:700px){header{grid-template-columns:1fr!important;gap:10px!important}header h1{text-align:center}.coins{justify-self:center;max-width:100%;font-size:14px;padding:8px 12px!important}}@media(max-width:390px){header h1{font-size:25px!important;letter-spacing:1px!important}.coins{font-size:12px!important}.sign{font-size:18px!important}}</style>
<style>
body{font-family:ui-rounded,"SF Pro Rounded","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif!important;background:radial-gradient(circle at 50% 5%,#eaffff 0,#72e9f2 38%,#159fc2 74%,#08749e 100%)!important}h1,.sign,.result-name,.draw,.book,.coins{letter-spacing:.4px}.coins{border:1px solid #ffffffaa!important;background:#ffffffdc!important;backdrop-filter:blur(12px);box-shadow:0 8px 24px #04668735!important}.machine{border-color:#06658f!important;background:linear-gradient(120deg,#078fc0,#7cf2f1 18%,#24cfe3 48%,#b5ffff 82%,#098ebb)!important;box-shadow:inset 0 0 0 2px #caffff99,inset 0 0 35px #ffffff55,0 18px 0 #06496f,0 28px 45px #003f5b55!important}.sign{border-width:2px!important;background:linear-gradient(100deg,#052e5f,#07598a,#052e5f)!important;box-shadow:inset 0 0 18px #29deff55,0 6px 18px #03466455}.door{border-width:4px!important;background:radial-gradient(circle at 50% 38%,#32e6f3,#087aac 42%,#03234f 100%)!important;box-shadow:inset 0 0 45px #001c4588,0 0 22px #37ebff77!important}.door:before{font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif!important;letter-spacing:3px;text-shadow:0 4px 12px #001b3e,0 0 28px #80ffff!important}.draw{border:3px solid #ffb3aa!important;background:linear-gradient(145deg,#ff8d85,#ff385d 50%,#be1747)!important;box-shadow:inset 0 2px 5px #fff9,0 9px 0 #8c1640,0 14px 26px #8c164066!important;transition:transform .16s,filter .16s,box-shadow .16s}.draw:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.08)}.draw:active{transform:translateY(6px) scale(.98)!important;box-shadow:inset 0 2px 5px #fff7,0 3px 0 #8c1640!important}.result{border:1px solid #ffffffcc!important;border-radius:28px!important;background:linear-gradient(145deg,#ffffffee,#eaffffdd)!important;backdrop-filter:blur(18px);box-shadow:inset 0 1px #fff,0 18px 45px #0355793d!important}.result h2{color:#08678d!important;font-weight:900}.result-name{background:linear-gradient(90deg,#dd3673,#6c4ee9,#079dcc);background-clip:text;-webkit-background-clip:text;color:transparent!important}.result-img{animation:resultFloat 3s ease-in-out infinite;filter:drop-shadow(0 18px 13px #06496744)!important}.book{border:1px solid #fff5c8!important;border-radius:17px!important;background:linear-gradient(145deg,#fff1a7,#ffc94f)!important;box-shadow:inset 0 2px #fff8,0 8px 0 #8a5423,0 14px 28px #47301544!important;transition:.2s}.book:hover{transform:translateY(-3px) rotate(-1deg)}.drawer{border-width:3px!important;box-shadow:-16px 12px 45px #00294666}.card{transition:transform .2s,box-shadow .2s}.card.got:hover{transform:translateY(-4px) rotate(1deg);box-shadow:0 8px 18px #73481d30}.machine.spinning{animation:machineGlow .16s alternate 6}.machine.spinning .door:before{animation:scanText .12s alternate 7}.spark{box-shadow:0 0 18px var(--c)}@keyframes resultFloat{50%{transform:translateY(-9px) scale(1.015)}}@keyframes machineGlow{to{filter:brightness(1.2);box-shadow:inset 0 0 35px #fff,0 18px 0 #06496f,0 0 55px #7dffff}}@keyframes scanText{to{transform:scale(1.04);filter:brightness(1.7);text-shadow:5px 0 #ff61bf,-5px 0 #5ffaff}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.prize-pop{animation:popSlow 1.1s cubic-bezier(.2,.75,.25,1) forwards!important}@keyframes popSlow{0%{transform:translate(-50%,5%) scale(.05) rotate(-15deg);opacity:0}20%{transform:translate(-50%,-55%) scale(1.18) rotate(5deg);opacity:1}42%{transform:translate(-50%,-52%) scale(1);opacity:1}78%{transform:translate(-50%,-58%) scale(1.03);opacity:1}90%{transform:translate(-50%,-55%) scale(.92);opacity:1}100%{transform:translate(36vw,-52%) scale(.16) rotate(18deg);opacity:0}}.layout{grid-template-columns:1fr!important;justify-items:center}.layout>.machine{width:min(560px,100%)}.door>.result{position:absolute;inset:18px 18px 76px;z-index:8;min-height:0!important;border:1px solid #a9ffffcc!important;border-radius:20px!important;padding:10px!important;background:radial-gradient(circle,#fffffffa,#d8ffffee)!important;box-shadow:0 0 35px #73ffffaa!important;animation:screenReveal .45s cubic-bezier(.2,.8,.3,1)}.door>.result.empty{display:none}.door>.result h2{font-size:16px;margin:0}.door>.result .result-img{height:min(245px,65%);width:75%}.door>.result .result-name{font-size:23px}@keyframes screenReveal{from{opacity:0;transform:scale(.55);filter:brightness(2)}to{opacity:1;transform:scale(1);filter:brightness(1)}}
</style>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#c9ffff,#55d8e8 55%,#109abb);font-family:Arial,sans-serif;color:#07385b;display:grid;place-items:center;padding:14px}.app{width:min(1050px,100%)}header{display:flex;justify-content:space-between;align-items:center;color:#fff;text-shadow:0 2px #087292;margin-bottom:10px}h1{font-size:clamp(21px,3vw,34px);margin:0}.coins{background:#fff;color:#096889;border:3px solid #0879a0;border-radius:18px;padding:9px 15px;font-weight:800;box-shadow:0 5px 0 #086184}.layout{display:grid;grid-template-columns:minmax(360px,560px) minmax(260px,1fr);gap:20px;align-items:center}.machine{position:relative;border:8px solid #075680;border-radius:28px;padding:16px;background:linear-gradient(90deg,#159bc9,#a7f5f2 12%,#29cbe1 50%,#a7f5f2 88%,#159bc9);box-shadow:inset 0 0 0 7px #5ce8ee,0 14px 0 #073d66}.sign{text-align:center;background:#063964;color:#c9ffff;border:5px solid #63eafa;border-radius:16px;padding:12px;font-size:23px;font-weight:900}.door{height:420px;margin:13px auto 0;border:8px solid #075680;border-radius:15px;position:relative;display:grid;place-items:center;text-align:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,#27dced 0 13%,#087aac 45%,#042f61 100%);box-shadow:inset 20px 0 32px #00284b77,inset -20px 0 32px #00284b77}.door:before{content:'AI BOT\A MYSTERY';white-space:pre;color:#eaffff;font:900 40px/1.25 monospace;text-shadow:0 4px #07375c,0 0 22px #77fbff}.door:after{content:'?  ?  ?';position:absolute;left:0;right:0;bottom:0;padding:18px;background:#04284e;border-top:6px solid #20d1e7;color:#78f4ff;font:900 30px monospace}.machine.spinning .door{animation:shake .09s alternate 5}.panel{display:flex;justify-content:center;align-items:center;gap:18px;background:#bdfaf5;border:6px solid #075680;border-radius:0 0 18px 18px;margin:0 8%;padding:15px}.draw{width:130px;height:92px;border-radius:26px;border:7px solid #7e251d;background:radial-gradient(circle at 35% 25%,#ff9b8f,#ff4035 48%,#b81722);color:#fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 8px 0 #701b22}.draw:active{transform:translateY(5px)}.draw:disabled{filter:grayscale(.5)}.hint{font-weight:800;font-size:14px}.result{background:#fffef3;border:7px solid #97602b;border-radius:18px;padding:18px;text-align:center;min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:8px 10px 0 #744719}.result h2{margin:0 0 8px;color:#805129}.result-img{width:min(260px,85%);height:270px;object-fit:contain;filter:drop-shadow(0 12px 9px #12455b44)}.result.empty .result-img{display:none}.question{font-size:85px;color:#d3b471}.result-name{font-size:25px;font-weight:900;color:#d94478}.book{position:fixed;right:17px;bottom:18px;border:4px solid #754523;border-radius:12px;background:#ffda70;color:#69441f;padding:13px 15px;font-weight:900;cursor:pointer;box-shadow:5px 6px 0 #754523;z-index:30}.book span{background:#ff4e85;color:#fff;border-radius:15px;padding:4px 8px}.drawer{position:fixed;right:10px;top:10px;bottom:10px;width:min(455px,calc(100vw - 20px));z-index:50;padding:25px 20px 20px 46px;border:7px solid #85552d;border-radius:12px 22px 22px 12px;background-color:#fffdf0;background-image:repeating-linear-gradient(180deg,transparent 0 30px,#9ed8e255 31px,#9ed8e255 32px);transform:translateX(calc(100% + 30px));transition:.28s;overflow:auto}.drawer.open{transform:none}.drawer h2{margin:0 0 15px}.close{position:absolute;right:10px;top:10px;border:3px solid #85552d;background:#fff4c9;border-radius:50%;width:38px;height:38px;font-size:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{position:relative;aspect-ratio:1;border:2px dashed #aa7845;border-radius:10px;background:#fff;padding:5px 5px 23px;text-align:center}.card img{width:100%;height:100%;object-fit:contain;filter:brightness(0);opacity:.16}.card.got img{filter:none;opacity:1}.card b{position:absolute;bottom:4px;left:2px;right:2px;font-size:10px;color:#68401f}.prize-pop{position:fixed;left:50%;top:48%;width:240px;height:240px;z-index:80;pointer-events:none;animation:pop 1.15s forwards}.prize-pop img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 15px 10px #003c5e66)}.spark{position:fixed;left:50%;top:48%;width:10px;height:10px;border-radius:50%;background:var(--c);z-index:79;animation:burst .8s forwards}@keyframes shake{to{transform:translateX(4px)}}@keyframes pop{0%{transform:translate(-50%,-20%) scale(.05);opacity:0}35%{transform:translate(-50%,-55%) scale(1.2);opacity:1}75%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-48%) scale(.85);opacity:0}}@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(1.5);opacity:0}}@media(max-width:760px){body{display:block}.layout{grid-template-columns:1fr}.door{height:370px}.result{min-height:350px}.result-img{height:230px}}
</style></head><body><main class="app"><header><h1>AI BOT MALL RANDOM</h1><div class="coins">🪙 เหรียญ <b id="coins">5</b></div></header><div class="layout"><section class="machine" id="machine"><div class="sign">AI BOT MYSTERY MACHINE</div><div class="door"></div><div class="panel"><button class="draw" id="draw" type="button">กดสุ่ม<br>1 ตัว</button><div class="hint" id="status">ได้แน่นอนทุกครั้ง</div></div></section><aside class="result empty" id="result"><h2>ผลการสุ่ม</h2><div class="question">?</div><img class="result-img" id="resultImg" alt=""><div class="result-name" id="resultName">กดปุ่มสีแดงเพื่อสุ่ม</div></aside></div></main><button class="book" id="book" type="button">📖 สมุดสะสม <span id="count">0</span></button><aside class="drawer" id="drawer"><button class="close" id="close" type="button">×</button><h2>BOT COLLECTION</h2><div class="grid" id="grid"></div></aside>
<script>
const bots=[['01-sky-blue.png','Sky Blue'],['02-strawberry-pink.png','Strawberry Pink'],['03-mint-green.png','Mint Green'],['04-sunny-yellow.png','Sunny Yellow'],['05-lavender.png','Lavender'],['06-peach-orange.png','Peach Orange'],['07-ocean-teal.png','Ocean Teal'],['08-chocolate-brown.png','Chocolate Brown'],['09-cloud-white.png','Cloud White'],['10-rainbow-pastel.png','Rainbow Pastel'],['11-rainbow-secret.png','Rainbow Secret']];
const asset='./ai-bot-assets/',el=id=>document.getElementById(id);
const embedded=new URLSearchParams(location.search).get('embed')==='1'&&window.parent!==window;
let coins=5,busy=false,audio,owned=new Set;
if(!embedded){try{owned=new Set(JSON.parse(localStorage.getItem('aiBotCollection')||'[]').map(v=>typeof v==='number'?v:Number(String(v).replace('b',''))-1).filter(v=>v>=0&&v<11))}catch(e){}}
function botIndex(value){if(typeof value==='number')return value;return bots.findIndex(b=>b[1]===String(value||''))}
function save(){if(embedded)return;try{localStorage.setItem('aiBotCollection',JSON.stringify([...owned]))}catch(e){}}
function render(){el('grid').innerHTML=bots.map((b,i)=>`<div class="card ${owned.has(i)?'got':''}"><img src="${asset+b[0]}" alt="${b[1]}"><b>${b[1]}</b></div>`).join('');el('count').textContent=owned.size;el('coins').textContent=Math.max(0,Number(coins)||0)}
function tone(f,d,delay=0){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime+delay;o.frequency.value=f;g.gain.setValueAtTime(.04,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(audio.destination);o.start(n);o.stop(n+d)}catch(e){}}
function effects(){for(let i=0;i<28;i++){let s=document.createElement('i'),a=Math.random()*6.283,d=80+Math.random()*180;s.className='spark';s.style.setProperty('--c',['#fff','#fff35b','#56f7ff','#ff65c8'][i%4]);s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}
function showPrize(bot){if(!bot)return;const i=botIndex(bot.name),known=i>=0?bots[i]:[bot.file,bot.name];if(i>=0)owned.add(i);render();el('machine').classList.add('spinning');el('result').classList.remove('empty');document.querySelector('.question').style.display='none';el('resultImg').src=asset+known[0];el('resultImg').alt=known[1];el('resultName').textContent=known[1];el('status').textContent='ได้รับ '+known[1]+' แล้ว!';let pop=document.createElement('div');pop.className='prize-pop';pop.innerHTML=`<img src="${asset+known[0]}" alt="${known[1]}">`;document.body.appendChild(pop);tone(440,.15);tone(660,.18,.12);tone(880,.3,.28);effects();setTimeout(()=>{pop.remove();el('machine').classList.remove('spinning');el('draw').disabled=coins<=0;busy=false},1150)}
function drawStandalone(){if(busy)return;if(coins<1)coins=5;busy=true;el('draw').disabled=true;coins--;let fresh=bots.map((_,i)=>i).filter(i=>!owned.has(i)),pool=fresh.length?fresh:bots.map((_,i)=>i),i=pool[Math.floor(Math.random()*pool.length)],bot={file:bots[i][0],name:bots[i][1]};owned.add(i);save();showPrize(bot)}
function drawEmbedded(){if(busy)return;if(coins<=0){el('status').textContent='ตราสัญลักษณ์หมดแล้ว — รับเพิ่มจากภารกิจท้ายบทแล้วกลับมาสุ่มได้';el('draw').disabled=true;return}busy=true;el('draw').disabled=true;el('machine').classList.add('spinning');el('status').textContent='กำลังสุ่มน้องชวนคิด…';window.parent.postMessage({type:'ai-bot-draw-request'},'*')}
function drawBot(){el('drawer').classList.remove('open');if(embedded)drawEmbedded();else drawStandalone()}
function applyConfig(data){coins=Math.max(0,Number(data.tickets)||0);owned=new Set((data.owned||[]).map(botIndex).filter(i=>i>=0));render();if(!busy)el('status').textContent=coins?'ตราสัญลักษณ์สะสมใช้สุ่มได้อีก '+coins+' ครั้ง':'ตราสัญลักษณ์หมดแล้ว — กลับไปสะสมเพิ่มได้';el('draw').disabled=coins<=0}
document.body.style.setProperty('background','radial-gradient(circle at 50% 8%,#f7fbff,#e7f0f7 58%,#dceaf3)','important');document.querySelector('h1').textContent='AI BOT MYSTERY';Object.assign(document.querySelector('h1').style,{fontSize:'clamp(28px,4vw,46px)',fontWeight:'950',letterSpacing:'2px',textShadow:'0 3px 0 #076486,0 0 20px #ffffff,0 0 34px #38eeff'});document.querySelector('.coins').firstChild.textContent='🏅 เหรียญตราคงเหลือ ';document.querySelector('.door').appendChild(el('result'));
el('draw').addEventListener('click',drawBot);el('book').addEventListener('click',()=>el('drawer').classList.add('open'));el('close').addEventListener('click',()=>el('drawer').classList.remove('open'));
window.addEventListener('message',event=>{const data=event&&event.data;if(!data)return;if(embedded&&event.source!==window.parent)return;if(data.type==='ai-bot-config'){applyConfig(data)}else if(data.type==='ai-bot-draw-result'){coins=Math.max(0,Number(data.tickets)||0);(data.owned||[]).map(botIndex).filter(i=>i>=0).forEach(i=>owned.add(i));showPrize(data.prize)}});
render();if(embedded)window.parent.postMessage({type:'ai-bot-ready'},'*');
</script></body></html>
